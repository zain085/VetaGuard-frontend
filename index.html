<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VetaGuard — Smarter Care. Healthier Pets. Stronger Bonds. A centralized pet-care, veterinary, and adoption platform." />
    <title>VetaGuard — Smarter Care. Healthier Pets. Stronger Bonds.</title>
    <script>
      // Apply saved/system theme before paint to avoid a light->dark flash
      (function () {
        try {
          var saved = localStorage.getItem("vetaguard-theme");
          var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
